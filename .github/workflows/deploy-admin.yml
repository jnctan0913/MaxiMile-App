name: Deploy Admin Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'maximile-app/admin-dashboard/**'
      - 'auth-pages/**'
      - 'index.html'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: maximile-app/admin-dashboard

      - name: Build
        run: npm run build
        working-directory: maximile-app/admin-dashboard
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Prepare Pages Artifact
        run: |
          mkdir -p deployment
          # Landing page at root
          cp index.html deployment/
          # Assets the landing page references via relative paths
          mkdir -p deployment/maximile-app
          cp -r maximile-app/assets deployment/maximile-app/assets
          cp -r maximile-app/screenshots deployment/maximile-app/screenshots
          # Admin dashboard at /admin subdirectory
          mkdir -p deployment/admin
          cp -r maximile-app/admin-dashboard/dist/* deployment/admin/
          # Auth pages at /auth subdirectory
          mkdir -p deployment/auth
          cp -r auth-pages/* deployment/auth/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deployment

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
